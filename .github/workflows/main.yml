name: Build Phoenix Companies

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Gem build
        uses: actions/upload-artifact@v4
        with:
          name: npwd-phoenix-companies-build
          path: web/dist
